  # PE4's DEFAULT address family reports "% BGP instance 'default' not active",
  # like the P-routers -- that part is real device output. An earlier version
  # of this comment wrongly generalized that single-AF fact into a blanket
  # denial that BGP runs here at all (B-504, corrected 2026-08-19): PE4 runs a
  # separate MP-BGP VPNv4 process, with an Established session to RR1 (2
  # prefixes, confirmed from both ends). Filed rather than silently edited,
  # per OBS-139 (an operator note has twice held an answer nobody read). Per
  # operator decision the correction now lives in NetBox (`netbox.py`'s
  # derived `bgp_vpnv4_peers` custom field, B-509), not here, so it cannot
  # drift out of sync with a second hand-typed copy. `bgp_peers` below stays
  # absent rather than zero for the reason this comment always gave:
  # `expected` is derived from the DEFAULT address family only, and zero
  # would claim a process that produced no peers, which is not what this
  # device reports on that AF.
  - name: PE4
    mgmt_ip: 172.20.250.24
    role: edge
    site: lab
    expected:
      isis_adjacencies: 2

    notes:
      - applies_to: isis
        note: >-
          Historical (2026-08-16): same as PE2 -- the recorded isis_adjacencies baseline of 0
          was learned from a broken fabric. Role invariants, not the baseline, were what caught
          isolation here.
        author: operator
        recorded: "2026-08-16"
        revisit_when: >-
          the expected: block is re-derived against a fabric verified healthy first
      - applies_to: isis
        note: >-
          Resolved 2026-08-19 (B-465/B-516): re-derived against the fresh t0/t1 capture (see
          PE2's note for why the prior capture could not be trusted). PE4 now shows 2 IS-IS
          adjacencies (P3, P4), matching PE1/PE2/RR1's pattern; suspicious_baseline no longer
          fires.
        author: operator
        recorded: "2026-08-19"
        revisit_when: >-
          PE4's isis_adjacencies count changes again, so this baseline gets re-derived rather
          than drifting stale a second time
      - applies_to: bgp
        note: >-
          Every BGP session on this lab carries 0 prefixes -- nothing is advertised into it.
          `bgp_no_prefixes` is the normal state here and is not a fault.
        author: operator
        recorded: "2026-08-16"
        revisit_when: >-
          the lab starts advertising real prefixes
  - name: RR1
    mgmt_ip: 172.20.250.31
    role: route-reflector
    site: lab
    router_id: 10.255.0.31
    local_as: 65000
