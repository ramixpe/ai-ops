[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-nettools"
version = "0.2.0"
description = "Safe, read-only Cisco IOS-XR network inspection tools with an LLM reasoning layer and MCP server."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["networking", "cisco", "ios-xr", "netmiko", "mcp", "llm", "read-only"]
# `authors` and `[project.urls]` are deliberately absent rather than guessed:
# how to attribute this, and which repository URL is canonical, are the
# maintainer's calls. Add them before any publish to an index.
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: System :: Networking :: Monitoring",
]
dependencies = [
    "netmiko>=4.4.0",
    "mcp>=1.9.0",
    "python-dotenv>=1.0.1",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    # Template parsing for parameterized command output (template_parsers.py).
    # A core dependency, not an extra: run_template attaches parsed data on
    # every call, so the package cannot do its job without it. Base install is
    # ~1.1 MB with zero runtime dependencies of its own -- every entry in ttp's
    # requires_dist sits behind its "full" or "docs" extras, which we do not
    # install. See docs/build/FINDINGS.md OBS-029 for the Genie comparison.
    "ttp>=0.9,<1.0",
]

[project.optional-dependencies]
# LLM SDKs are only needed to run analysis with a cloud provider. Ollama uses
# the standard library, so it needs nothing here.
llm = [
    "anthropic>=0.54.0",
    "openai>=1.99.0",
]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.8.0",
]

[project.scripts]
nettools = "agent_nettools.cli:main"
nettools-mcp = "mcp_server.server:main"

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["agent_nettools*", "mcp_server*"]
exclude = ["tests*", "scripts*", "docs*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live_lab: needs a reachable live IOS-XR lab (real SSH, real credentials). Skipped by default -- run with `NETTOOLS_LIVE_LAB=1 pytest -m live_lab` (see tests/test_live_lab.py).",
]

[tool.ruff]
line-length = 100
# evidence-archive/ holds committed round payloads and the instruments that
# produced them. Those files are evidence: they must stay byte-identical to
# what ran, so a formatter must not touch them. Linting an artefact is a
# category error, and `--fix` on one silently rewrites the record.
exclude = ["evidence-archive"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]
