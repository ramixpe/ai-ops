[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-nettools"
version = "2.1.0"
description = "Safe, read-only Cisco IOS-XR network inspection tools with an LLM reasoning layer and MCP server."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["networking", "cisco", "ios-xr", "netmiko", "mcp", "llm", "read-only"]
authors = [{ name = "ramixpe" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Networking :: Monitoring",
]
dependencies = [
    "netmiko>=4.4.0,<5.0",
    # mcp: floor >=1.9.0 predates the 1.x/2.x high-level-server rename that
    # mcp_server/server.py already carries a compatibility shim for (imports
    # MCPServer, falls back to the pre-2.0 FastMCP name). Verified installed
    # is 2.0.0 (EER-013, 2026-08-20) -- the upper bound is set to admit that
    # major version rather than exclude it, since the shim already covers
    # both sides of the rename.
    "mcp>=1.9.0,<3.0",
    # Direct dependencies for the authenticated native MCP HTTP transports.
    "starlette>=1.6.0,<2.0",
    "uvicorn>=0.52.0,<1.0",
    "python-dotenv>=1.0.1,<2.0",
    "pydantic>=2.7,<3.0",
    "pyyaml>=6.0,<7.0",
    # Template parsing for parameterized command output (template_parsers.py).
    # A core dependency, not an extra: run_template attaches parsed data on
    # every call, so the package cannot do its job without it. Base install is
    # ~1.1 MB with zero runtime dependencies of its own -- every entry in ttp's
    # requires_dist sits behind its "full" or "docs" extras, which we do not
    # install. The Genie comparison remains in Git history.
    "ttp>=0.9,<1.0",
]

[project.urls]
Homepage = "https://github.com/ramixpe/ai-ops"
Repository = "https://github.com/ramixpe/ai-ops"
Issues = "https://github.com/ramixpe/ai-ops/issues"

[project.optional-dependencies]
# LLM SDKs are only needed to run analysis with a cloud provider. Ollama uses
# the standard library, so it needs nothing here.
llm = [
    "anthropic>=0.54.0",
    "openai>=1.99.0",
]
dev = [
    # B-208's property suite. Declared here rather than left as an ad-hoc
    # venv install, so the Stage-2 gate actually runs for anyone who checks
    # this out -- a dependency that exists only on one machine is a test
    # that silently skips everywhere else.
    "hypothesis>=6",
    "pytest>=8.3.0",
    "ruff>=0.8.0",
    # EER-012: builds the wheel/sdist that CI installs and exercises from
    # outside the checkout, instead of only ever testing an editable install.
    "build>=1.0",
    # EER-014: coverage measurement, reported (not gated on an unmeasured
    # number) in CI's test job.
    "pytest-cov>=5.0",
]
# The neo4j driver, needed only by graph.write_graph -- the thin half of the
# topology collector. Never a core dependency: graph.build_graph (the pure
# half) and every other tool in this package must keep working with no graph
# database configured, and no import of `neo4j` happens anywhere outside
# write_graph's own function body (it is imported lazily, in-function).
graph = [
    "neo4j>=5.0,<6.0",
]
# The pynetbox client, needed only by netbox.write_records -- the thin half
# of the NetBox inventory collector (Stage-2 M3b). Never a core dependency:
# netbox.build_records/describe_writes/format_plan (the pure half) and every
# other tool in this package must keep working with no NetBox configured,
# and no import of `pynetbox` happens anywhere outside write_records' own
# function body (it is imported lazily, in-function) -- same discipline as
# the `graph` extra above.
netbox = [
    "pynetbox>=7.0,<8.0",
]

[project.scripts]
nettools = "agent_nettools.cli:main"
nettools-mcp = "mcp_server.server:main"

[tool.setuptools.package-data]
# data/*.yaml: inventory/lab.yaml's packaged fallback copy (R2).
# data/prompts/*.txt: every runtime-required prompt version (EER-003) --
# report.v1/v2, correlate.v1..v4, troubleshooting/fabric_analysis/
# agent_system at v1 (moved out of Python 2026-08-21), and event_agent.v1
# (packaged 2026-08-23 -- docs/findings_gpt_23aug.md H1; it shipped without a
# packaged twin for two days because a hand-maintained test list didn't know
# it existed). `.txt` needs its own entry; the yaml glob above does not cover
# it. The count is deliberately NOT written here any more -- a stale count is
# exactly what let H1 happen once already (this comment used to say "nine"
# while the tree held ten). `tests/test_packaging_prompts.py` now derives the
# required set from `prompts/*.txt` itself and fails if this glob ever misses
# one of them, which is the only guard worth trusting.
# data/fixtures/**/*.txt: the packaged demo fixture subset (EER-004) -- the
# files the README-documented `--from-fixtures` commands actually read, not
# the full tests/fixtures/ corpus. See fixtures.py's `_packaged_fixture_root`.
agent_nettools = ["data/*.yaml", "data/prompts/*.txt", "data/fixtures/**/*.txt"]

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["agent_nettools*", "mcp_server*"]
exclude = ["tests*", "scripts*", "docs*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Put the tree's OWN src/ ahead of the editable install on sys.path.
# Without this, an agent working in a git worktree that shares this repo's
# .venv silently tests the MAIN checkout's code: the editable install
# resolves `agent_nettools` to an absolute path outside the worktree, so a
# worktree's own edits are invisible to its own test run and it reports
# green for code it never executed (measured 2026-08-19, OBS-185).
pythonpath = ["src"]
markers = [
    "live_lab: needs a reachable live IOS-XR lab (real SSH, real credentials). Skipped by default -- run with `NETTOOLS_LIVE_LAB=1 pytest -m live_lab` (see tests/test_live_lab.py).",
]

[tool.ruff]
line-length = 100
# evidence-archive/ holds committed round payloads and the instruments that
# produced them. Those files are evidence: they must stay byte-identical to
# what ran, so a formatter must not touch them. Linting an artefact is a
# category error, and `--fix` on one silently rewrites the record.
exclude = ["evidence-archive"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# (The docs/diagrams generator scripts this section once carved an exception
# for were retired 2026-08-23: the diagram set is now a single hand-authored
# HTML layer, not generated, so there is no generator code left to ignore.)
