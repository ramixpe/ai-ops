name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        # constraints.txt (EER-013): pins the exact versions verified to work
        # together, so this resolves the same graph every run instead of
        # whatever each package's index happens to serve on a given day.
        run: |
          python -m pip install --upgrade pip
          pip install -c constraints.txt -e ".[dev,llm]"
      - name: Lint
        run: ruff check .
      - name: Test with coverage
        # EER-014. 90% is a measured floor, not a guess: the suite covered
        # 93% of src/agent_nettools + mcp_server on 2026-08-20 (10,495
        # statements, 727 missed; see constraints.txt's generation date for
        # the same verification pass). Set a few points under that measured
        # number, not at it, as headroom for cross-version variance between
        # this matrix's 3.11 and 3.12 legs (only 3.11 was measured locally)
        # -- so this ratchets against real regressions instead of failing on
        # day one or chasing a moving target.
        run: pytest -q --cov=agent_nettools --cov=mcp_server --cov-report=term-missing --cov-fail-under=90

  # B-423. The offline demo's entire value is that it needs nothing, so nothing
  # is the only environment that tests it.
  #
  # `tests/test_cli_investigate.py` already strips the environment with
  # monkeypatch, which catches the code path. It cannot catch a future
  # dependency on a file, a socket, or a package that happens to be installed
  # on a developer's machine -- and that is exactly how the demo broke once
  # already (OBS-072): every manual check passed because `main()` loads this
  # repo's `.env`, which holds real credentials. The verification environment
  # was contaminated by the thing being verified.
  #
  # This is §0.13's setup face given a permanent guard. The failure it prevents
  # is invisible from inside the repository, so the fix has to be an
  # environment rather than an inspection.
  offline-demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install without the LLM extra
        # Deliberately not ".[dev,llm]". No provider SDK is installed, so an
        # import of one would fail here rather than succeeding by accident on a
        # machine that happens to have it. constraints.txt (EER-013) still
        # applies -- it only constrains packages actually being installed.
        run: |
          python -m pip install --upgrade pip
          pip install -c constraints.txt -e .

      - name: Prove there is no .env and no credentials
        run: |
          test ! -f .env || { echo "a .env exists in a clean checkout"; exit 1; }
          for v in DEVICE_USERNAME DEVICE_PASSWORD DEVICE_SSH_KEYFILE \
                   ANTHROPIC_API_KEY OPENAI_API_KEY MINIMAX_API_KEY LLM_PROVIDER; do
            if [ -n "${!v-}" ]; then echo "$v is set"; exit 1; fi
          done
          echo "clean: no .env, no credentials, no API keys"

      - name: Detect whether this runner can isolate the network
        id: iso
        # `unshare -rn` gives an empty network namespace. It needs unprivileged
        # user namespaces, which ubuntu-latest has and some runners do not.
        # Detected and ANNOUNCED rather than assumed -- a job that silently
        # stops isolating is the silent-degradation shape this build exists to
        # remove. The hard no-network guarantee is
        # `tests/test_end_to_end_offline.py`, which replaces netmiko with a
        # module that raises; this job's own value is the *environment*.
        run: |
          if unshare -rn true 2>/dev/null; then
            echo "run=unshare -rn" >> "$GITHUB_OUTPUT"
            echo "network isolation: ON (unshare -rn)"
          else
            echo "run=" >> "$GITHUB_OUTPUT"
            echo "network isolation: OFF -- this runner cannot unshare."
            echo "Clean-environment checks still apply; no-network is covered"
            echo "by tests/test_end_to_end_offline.py."
          fi

      - name: Run the offline demo
        run: |
          set -o pipefail
          ${{ steps.iso.outputs.run }} nettools investigate RR1 10.255.0.12 \
            --from-fixtures --format table > out.txt 2> err.txt && code=0 || code=$?
          cat out.txt; echo "--- stderr ---"; cat err.txt
          test "$code" = "1" || { echo "expected exit 1, got $code"; exit 1; }
          grep -q "interface_line_down" out.txt
          grep -q "bgp_session" out.txt
          grep -q -- "<-- CAUSE" out.txt
          echo "a named rung and a causal chain, from nothing"

      - name: All three exit codes are reachable
        run: |
          ${{ steps.iso.outputs.run }} nettools investigate RR1 10.255.0.12 \
            --from-fixtures --label healthy --quiet && h=0 || h=$?
          ${{ steps.iso.outputs.run }} nettools investigate RR1 10.255.0.12 \
            --from-fixtures --label t0 --quiet && t=0 || t=$?
          test "$h" = "0" || { echo "healthy: expected 0, got $h"; exit 1; }
          test "$t" = "2" || { echo "t0: expected 2, got $t"; exit 1; }
          echo "0 / 1 / 2 all reachable with no lab, no key, no network"

      - name: --format json is consumable on its own
        run: |
          ${{ steps.iso.outputs.run }} nettools investigate RR1 10.255.0.12 \
            --from-fixtures --format json 2>/dev/null \
            | python -c "import json,sys; assert json.load(sys.stdin)['finding']"
          echo "json output parses without stripping anything"

  # EER-012. Every job above tests a checkout (`pip install -e .`), which is
  # not the thing that ships. That gap is exactly how the six prompt files
  # and the demo fixture subset went missing from the wheel (EER-003/EER-004,
  # 2026-08-20) -- `[tool.setuptools.package-data]` was correct in
  # pyproject.toml and no test noticed, because no test ever built the wheel,
  # installed it somewhere with no source tree nearby, and ran it. This job
  # is that check: build the real artifact, install *that* (not `-e`, not
  # `.`), and run the documented offline demo from a directory that has never
  # seen this checkout.
  build-artifact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          pip install -c constraints.txt build

      - name: Build the wheel and sdist
        run: python -m build

      - name: Upload the built artifact
        uses: actions/upload-artifact@v4
        with:
          name: agent-nettools-dist
          path: dist/

      - name: Install the built wheel into a venv outside the checkout
        # Not `pip install -e .`, not `pip install .` from the checkout --
        # the wheel file itself, the same one just uploaded above.
        run: |
          python -m venv "$RUNNER_TEMP/artifact-venv"
          "$RUNNER_TEMP/artifact-venv/bin/pip" install --upgrade pip
          WHEEL="$(ls dist/*.whl)"
          "$RUNNER_TEMP/artifact-venv/bin/pip" install -c constraints.txt "$WHEEL"

      - name: Run the offline demo from outside the checkout
        # $RUNNER_TEMP is outside $GITHUB_WORKSPACE -- no ./tests/fixtures,
        # no ./prompts, no source tree of any kind nearby. If the packaged
        # data ever goes missing from the wheel again, this is where it is
        # caught. Assertions mirror the offline-demo job's own (exit codes,
        # named rung, causal-chain marker, parseable JSON).
        run: |
          NETTOOLS="$RUNNER_TEMP/artifact-venv/bin/nettools"
          mkdir -p "$RUNNER_TEMP/elsewhere"
          cd "$RUNNER_TEMP/elsewhere"

          set -o pipefail
          "$NETTOOLS" investigate RR1 10.255.0.12 \
            --from-fixtures --format table > out.txt 2> err.txt && code=0 || code=$?
          cat out.txt; echo "--- stderr ---"; cat err.txt
          test "$code" = "1" || { echo "expected exit 1, got $code"; exit 1; }
          grep -q "interface_line_down" out.txt
          grep -q "bgp_session" out.txt
          grep -q -- "<-- CAUSE" out.txt
          echo "installed wheel: a named rung and a causal chain, from outside the checkout"

          "$NETTOOLS" investigate RR1 10.255.0.12 \
            --from-fixtures --label healthy --quiet && h=0 || h=$?
          "$NETTOOLS" investigate RR1 10.255.0.12 \
            --from-fixtures --label t0 --quiet && t=0 || t=$?
          test "$h" = "0" || { echo "healthy: expected 0, got $h"; exit 1; }
          test "$t" = "2" || { echo "t0: expected 2, got $t"; exit 1; }
          echo "0 / 1 / 2 all reachable from the installed wheel"

          # NOT a pipeline into python: `set -o pipefail` is in force for this
          # whole block, and `investigate` exits 1 BY DESIGN when it finds a
          # fault, so piping it would fail the step on a correct run. (The
          # offline-demo job gets away with the pipeline form only because
          # each `run:` is its own shell and it never sets pipefail.) Caught
          # on the first real CI run of this job -- the demo output above it
          # was already correct. Redirect, assert the documented exit code,
          # then parse the file.
          "$NETTOOLS" investigate RR1 10.255.0.12 \
            --from-fixtures --format json > demo.json 2>/dev/null && j=0 || j=$?
          test "$j" = "1" || { echo "json run: expected exit 1, got $j"; exit 1; }
          "$RUNNER_TEMP/artifact-venv/bin/python" \
            -c "import json; assert json.load(open('demo.json'))['finding']"
          echo "json output parses without stripping anything"

      - name: nettools version matches the version this build declares
        run: |
          DECLARED="$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          cd "$RUNNER_TEMP/elsewhere"
          REPORTED="$("$RUNNER_TEMP/artifact-venv/bin/nettools" version \
            | "$RUNNER_TEMP/artifact-venv/bin/python" -c "import json,sys; print(json.load(sys.stdin)['nettools_version'])")"
          test "$DECLARED" = "$REPORTED" || {
            echo "pyproject.toml declares $DECLARED but the installed wheel reports $REPORTED"; exit 1;
          }
          echo "nettools version ($REPORTED) matches pyproject.toml"

      - name: nettools-mcp starts and exits cleanly
        # Nothing else in this repo invokes the second console script. Piping
        # in an already-closed stdin gives the stdio transport an immediate
        # EOF, which is the same "nothing to do" shape a client disconnect
        # produces -- proof the entry point imports, wires up its tools, and
        # returns rather than hanging or throwing on startup.
        run: |
          cd "$RUNNER_TEMP/elsewhere"
          timeout 20 "$RUNNER_TEMP/artifact-venv/bin/nettools-mcp" < /dev/null
          echo "nettools-mcp: started and exited cleanly on stdin EOF"

      - name: Build the Docker image
        # `make docker-build` is documented but nothing ran it before this.
        run: docker build -t ios-xr-nettools-mcp .

      - name: Containerized nettools-mcp starts and exits cleanly
        run: |
          timeout 20 docker run --rm -i ios-xr-nettools-mcp < /dev/null
          echo "container: started and exited cleanly on stdin EOF"

  # EER-014 (supply-chain half; coverage lives in the `test` job above).
  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install the project and pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install -c constraints.txt -e ".[dev,llm]" pip-audit

      - name: pip-audit
        # Report-only, deliberately: `continue-on-error` plus an explicit
        # `exit 0` keep this from blocking merges on findings this lane is
        # under instruction not to silently fix. A real finding is a
        # reviewable dependency-bump decision for a human, same discipline as
        # any other version bump -- see constraints.txt's own comment. Findings
        # are still loud: printed to the job log and to the run summary, not
        # swallowed.
        continue-on-error: true
        run: |
          set +e
          pip-audit > pip-audit-report.txt 2>&1
          status=$?
          cat pip-audit-report.txt
          {
            echo '### pip-audit'
            echo '```'
            cat pip-audit-report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" -ne 0 ]; then
            echo "pip-audit reported findings above -- not blocking CI (report-only; see EER-014)."
          fi
          exit 0
